<!doctype html>
<html lang="%lang%" data-theme="%theme%" data-theme-selector="%theme-selector%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="%color-scheme%" />
    <meta name="theme-color" content="#f8f9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%dark-theme-color%" media="(prefers-color-scheme: dark)" />
    <script src="%sveltekit.assets%/preferences.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
