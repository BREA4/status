name: Monitor and publish Pages
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# ASVS 15.4.1: serialize collection, history commits and deployments so old data cannot win.
concurrency:
  group: pages-monitor
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Read durable monitoring history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: monitoring-data
          path: .monitoring
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Collect checks and record history
        run: bun run monitor
        env:
          # ASVS 13.3.1: secrets are available only to collection, never to the static build.
          STATUS_FEED_URL: ${{ vars.STATUS_FEED_URL || secrets.STATUS_FEED_URL }}
          STATUS_FEED_TOKEN: ${{ secrets.STATUS_FEED_TOKEN }}
      - name: Save changed daily history
        working-directory: .monitoring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record monitoring history'
            git push origin HEAD:monitoring-data
          fi
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build static page and public status JSON
        run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: bun run test:static
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
